sonar.projectKey=JulianElda_arche
sonar.organization=julianelda
sonar.projectName=arche

# `sonar.test.inclusions` filters the `sonar.tests` set — without `sonar.tests`
# that set is empty and the patterns are inert, leaving test files in
# `sonar.sources` where they are analysed (and coverage-measured) as production
# code. Both properties point at `packages`; the test patterns below then split
# it, and the duplicated exclusions keep the two scopes in sync since neither
# `sonar.exclusions` nor `sonar.test.exclusions` filters the other's scope.
sonar.sources=packages
sonar.tests=packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-ssr/**,**/build/**,**/.svelte-kit/**,**/coverage/**,**/storybook-static/**,**/*.stories.*,packages/domos/src/routes/**,packages/scratchpad/src/**,**/*.test.ts,**/*.test.tsx,**/*.svelte.test.ts,**/*.spec.ts,**/*.spec.tsx,**/*_test.go
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/dist-ssr/**,**/build/**,**/.svelte-kit/**,**/coverage/**,**/storybook-static/**,**/*.stories.*,packages/domos/src/routes/**,packages/scratchpad/src/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.svelte.test.ts,**/*.spec.ts,**/*.spec.tsx,**/*_test.go

sonar.javascript.lcov.reportPaths=packages/domos/coverage/lcov.info,packages/scratchpad/coverage/lcov.info
sonar.go.coverage.reportPaths=packages/typos/coverage/coverage.out
# Coverage has no inclusions counterpart — only exclusions — so files no test
# suite reports on have to be named here or they are scored as 0%.
sonar.coverage.exclusions=packages/typos/bin/**,packages/lexis/**

sonar.sourceEncoding=UTF-8
