name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # TODO: pin to a commit SHA (like the other actions above) once verified —
      # not available from this sandbox (no network access to look up the hash).
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/typos/go.mod
      # TODO: pin to a specific released version once verified, for the same reason.
      - run: go install github.com/goreleaser/goreleaser/v2@latest
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run format -- --check
      - run: bun run lint
      - run: bun run check
      - run: bun run build
      - run: ./node_modules/.bin/playwright install chromium --with-deps --no-shell
      - run: bun run --filter @julianelda/domos test -- --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage
      - run: bun run --filter @julianelda/scratchpad test -- --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage
      - run: mkdir -p packages/typos/coverage
      - run: bun run --filter @julianelda/typos test -- -coverprofile=coverage/coverage.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: packages/*/coverage

  sonar:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: packages
      - uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
