name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # typos' main package and its platform packages (packages/typos/npm/*)
  # are always released together (release-please-config.json links their
  # versions) and must be split out of the generic per-path matrix below:
  # the platform packages carry no binary of their own until `typos`'
  # GoReleaser build produces one, and matrix jobs each get an isolated
  # checkout, so that build has to run once and publish everything itself
  # — see the publish-typos job.
  paths:
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      other: ${{ steps.split.outputs.other }}
      typos: ${{ steps.split.outputs.typos }}
    steps:
      - id: split
        run: |
          paths='${{ needs.release-please.outputs.paths_released }}'
          echo "other=$(jq -c '[.[] | select(startswith("packages/typos") | not)]' <<<"$paths")" >> "$GITHUB_OUTPUT"
          echo "typos=$(jq -c '[.[] | select(startswith("packages/typos"))]' <<<"$paths")" >> "$GITHUB_OUTPUT"

  publish:
    needs: paths
    if: ${{ needs.paths.outputs.other != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJSON(needs.paths.outputs.other) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          cd ${{ matrix.path }}
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            bun run build
          fi
      - name: Publish
        run: cd ${{ matrix.path }} && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-typos:
    needs: paths
    if: ${{ needs.paths.outputs.typos != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # TODO: pin to a commit SHA (like the other actions above) once verified —
      # not available from this sandbox (no network access to look up the hash).
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/typos/go.mod
      # TODO: pin to a specific released version once verified, for the same reason.
      - run: go install github.com/goreleaser/goreleaser/v2@latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Cross-compile every platform binary
        run: cd packages/typos && bun run build:all
      # Only publish paths release-please actually released in *this* run
      # (needs.paths.outputs.typos), not every platform package indis-
      # criminately — the 6 typos components release independently as
      # their own PRs merge, so a package not in this run's release list
      # hasn't had its own version bump yet and would publish stale/wrong.
      # Platform packages publish before the main package where both are
      # in this run: its optionalDependencies reference them by exact
      # version, so they should exist on the registry first when possible.
      - name: Publish released platform packages
        run: |
          echo '${{ needs.paths.outputs.typos }}' \
            | jq -r '.[] | select(startswith("packages/typos/npm/"))' \
            | while IFS= read -r dir; do
                (cd "$dir" && npm publish --access public)
              done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package
        if: ${{ contains(fromJSON(needs.paths.outputs.typos), 'packages/typos') }}
        run: cd packages/typos && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
