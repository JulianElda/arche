version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests write fixtures with loose permissions and spawn the scripts
      # they write on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
